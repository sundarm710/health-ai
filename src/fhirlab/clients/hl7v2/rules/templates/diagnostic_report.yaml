# OBR -> DiagnosticReport
resource: DiagnosticReport
segment: OBR
fields:
  - {to: "identifier[0].value",  from: OBR-3, required: true}
  - {to: "identifier[0].system", const: "http://hospital.example.org/lab-filler"}
  - {to: status,                 from: OBR-25, transform: {map: {F: final, P: preliminary, C: corrected, X: cancelled}}, required: true}
  - {to: "category[0]",          const: {coding: [{system: "http://terminology.hl7.org/CodeSystem/v2-0074", code: LAB}]}}
  - {to: code,                   from: OBR-4, transform: ce, required: true}
  - {to: effectiveDateTime,      from: OBR-7, transform: v2_ts}
  - {to: issued,                 from: OBR-22, transform: v2_ts}
